<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Hub</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#ffffff; --sunk:#f4f4f2; --line:#e4e4e0;
  --ink:#1b1b19; --ink-2:#5c5c57; --ink-3:#8e8e87;
  --accent:#3b5bdb; --accent-soft:#eaeeff;
  --ok:#2f7d58; --warn:#a8631b; --off:#b6b6b0;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131314; --panel:#1a1a1c; --sunk:#202023; --line:#2c2c30;
    --ink:#ecece9; --ink-2:#a6a6a1; --ink-3:#777772;
    --accent:#8ea3ff; --accent-soft:#232842;
    --ok:#6cc79a; --warn:#d99b56; --off:#55555a;
  }
}
:root[data-theme="dark"]{
  --bg:#131314; --panel:#1a1a1c; --sunk:#202023; --line:#2c2c30;
  --ink:#ecece9; --ink-2:#a6a6a1; --ink-3:#777772;
  --accent:#8ea3ff; --accent-soft:#232842;
  --ok:#6cc79a; --warn:#d99b56; --off:#55555a;
}
*{box-sizing:border-box}
/* Scrollbars are hidden, never the scrolling. Overlay bars on a two-pane layout put a
   permanent grey stripe down the middle of the page for no information gained. */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}

/* ---- shell ---- */
.app{
  display:grid;grid-template-columns:288px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);height:100vh;
  transition:grid-template-columns .16s ease;
}
.app.navclosed{grid-template-columns:0 minmax(0,1fr)}
.app.navclosed nav{opacity:0;pointer-events:none}
header{
  grid-column:1/-1;display:flex;gap:16px;align-items:center;
  padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);
}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:4px}
.brand b{font-size:14px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;
  border:1px solid var(--line);border-radius:999px;font-size:11.5px;
  font-family:var(--mono);color:var(--ink-2);background:var(--sunk);white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--off);flex:none}
.dot.on{background:var(--ok)}
.spacer{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:var(--sunk);
  border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;min-width:180px;
}
.search input{background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px;width:100%}
.search kbd{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:var(--panel);
}
.iconbtn{padding:6px;border-radius:var(--r);color:var(--ink-2);line-height:0}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}

/* ---- sidebar ---- */
nav{
  border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;overflow-x:hidden;padding:0 8px 40px;
  transition:opacity .12s ease;min-width:0;
}
.navhead{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 0 6px}
.navmode{display:flex;gap:2px;padding:2px;margin:0 4px;background:var(--sunk);border-radius:var(--r)}
.navmode button{flex:1;padding:5px;border-radius:6px;font-size:12px;color:var(--ink-2)}
.navmode button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.group{margin:1px 0}
.allcollapse{display:block;width:100%;text-align:right;padding:6px 8px 2px;font-size:10.5px;
  font-family:var(--mono);color:var(--ink-3);letter-spacing:.04em}
.allcollapse:hover{color:var(--ink-2)}
.group>summary{
  list-style:none;display:flex;align-items:center;gap:6px;
  padding:5px 7px;border-radius:6px;cursor:pointer;user-select:none;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-family:var(--mono);
}
.group>summary::-webkit-details-marker{display:none}
.group>summary:hover{background:var(--sunk);color:var(--ink-2)}
.group>summary .caret{transition:transform .12s ease;flex:none}
.group[open]>summary .caret{transform:rotate(90deg)}
.group>summary .fold{display:flex;align-items:center;padding:3px;margin:-3px;border-radius:4px;flex:none}
.group>summary .fold:hover{background:var(--line)}
.group>summary .gname{padding:1px 2px;border-radius:4px}
.group>summary .gname:hover{color:var(--accent);background:var(--accent-soft)}
.group>summary .count{margin-left:auto;font-size:10px;color:var(--ink-3)}
.items{padding-left:5px;border-left:1px solid var(--line);margin-left:12px}
.item{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:4px 8px;border-radius:6px;color:var(--ink-2);font-size:13px;
}
.item:hover{background:var(--sunk);color:var(--ink)}
.item[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:520}
.item .nm{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rl{font-size:10px;color:var(--ink-3);font-family:var(--mono);flex:none;opacity:.8}
.empty{padding:14px 10px;color:var(--ink-3);font-size:12.5px}

/* ---- main ---- */
main{overflow-y:auto;padding:0 0 80px}
.wrap{max-width:820px;margin:0 auto;padding:26px 28px}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:6px;word-break:break-all}
h1.title{font-size:23px;margin:0 0 10px;letter-spacing:-.015em;font-family:var(--mono)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--ink-2)}
.badge.cat{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.reach{font-size:12.5px;color:var(--ink-3);font-family:var(--mono);margin-bottom:22px}
.reach b{color:var(--ok);font-weight:500}
.rule{height:1px;background:var(--line);border:0;margin:22px 0}

/* ---- rendered markdown ---- */
.doc h1,.doc h2,.doc h3,.doc h4{line-height:1.3;letter-spacing:-.01em;margin:1.8em 0 .55em}
.doc h1{font-size:20px} .doc h2{font-size:17px} .doc h3{font-size:15px} .doc h4{font-size:14px;color:var(--ink-2)}
.doc h2{padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc>*:first-child{margin-top:0}
.doc p,.doc li{color:var(--ink-2)}
.doc li{margin:.25em 0}
.doc ul,.doc ol{padding-left:1.35em}
.doc strong{color:var(--ink);font-weight:600}
.doc code{font-family:var(--mono);font-size:.875em;background:var(--sunk);padding:.12em .38em;border-radius:4px;color:var(--ink)}
.doc pre{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;overflow-x:auto;margin:1em 0}
.doc pre code{background:none;padding:0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.doc blockquote{margin:1em 0;padding:2px 0 2px 14px;border-left:2px solid var(--line);color:var(--ink-3)}
.doc hr{border:0;height:1px;background:var(--line);margin:1.7em 0}
.tablewrap{overflow-x:auto;margin:1.1em 0;border:1px solid var(--line);border-radius:var(--r)}
.doc table{border-collapse:collapse;width:100%;font-size:13px}
.doc th,.doc td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.doc th{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:500;white-space:nowrap}
.doc tr:last-child td{border-bottom:0}

/* ---- overview ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:18px 0 26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card .n{font-size:26px;font-family:var(--mono);letter-spacing:-.03em}
.card .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-top:2px}
.card .s{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:7px}
.note{background:var(--sunk);border:1px solid var(--line);border-left:2px solid var(--warn);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--ink-2);margin:1em 0}
.cmd{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin:6px 0;font-family:var(--mono);font-size:12.5px}
.cmd code{flex:1;background:none;padding:0;overflow-x:auto;white-space:pre}
.copy{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--panel);flex:none}
.copy:hover{color:var(--ink)}
.linky{font-family:var(--mono);font-size:12.5px;color:var(--accent);padding:0}
.linky:hover{text-decoration:underline}

@media (max-width:780px){
  /* Too narrow for two columns, so the file list becomes an overlay. Same class drives
     both layouts - the button means "hide or show the list" at every width. */
  .app,.app.navclosed{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;inset:57px 0 0 0;z-index:10;border-right:0}
  .app.navclosed nav{display:none}
  .brand,.chips{display:none}
  .search{min-width:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="menu" title="Hide or show the file list" aria-label="Toggle file list">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand"><b>Agent Hub</b><span id="stamp"></span></div>
    <div class="chips" id="chips"></div>
    <div class="spacer"></div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" opacity=".5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search name or contents" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <button class="iconbtn" id="theme" title="Theme" aria-label="Theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/></svg>
    </button>
  </header>
  <nav id="nav">
    <div class="navhead">
      <div class="navmode" role="tablist">
        <button id="byCat" role="tab" aria-selected="true">Category</button>
        <button id="byDir" role="tab" aria-selected="false">Folder</button>
      </div>
      <button class="allcollapse" id="foldAll">collapse all</button>
    </div>
    <div id="tree"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const DATA = /*__PAYLOAD__*/{};

/* ---------- tiny markdown renderer -------------------------------------------------
   Enough for the files this repo actually holds: headings, fences, tables, lists,
   quotes, rules and inline marks. Deliberately not a full CommonMark engine - the
   alternative was a CDN script, and a CDN is a network dependency on an offline file. */
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_,t,h)=>'<a href="'+h+'" rel="noreferrer">'+t+'</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function splitRow(l){
  return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
}
function markdown(src){
  const lines = String(src).replace(/\r/g,'').split('\n');
  let out = '', i = 0;

  // A leading --- block is frontmatter: its fields are shown as badges, not body text.
  if (lines[0] === '---') { let j = 1; while (j < lines.length && lines[j] !== '---') j++; i = j + 1; }

  const isTable = n => /\|/.test(lines[n]||'') && /^\s*\|?[\s:-]*-[-\s|:]*$/.test(lines[n+1]||'');

  while (i < lines.length){
    const l = lines[i];

    if (/^```/.test(l)){
      const lang = l.slice(3).trim(); let b = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) b.push(lines[i++]);
      i++;
      out += '<pre><code'+(lang?' class="lang-'+esc(lang)+'"':'')+'>'+esc(b.join('\n'))+'</code></pre>';
      continue;
    }
    if (/^\s*$/.test(l)){ i++; continue; }
    if (/^(---+|\*\*\*+|___+)\s*$/.test(l)){ out += '<hr>'; i++; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h){ const n = Math.min(h[1].length,4); out += '<h'+n+'>'+inline(h[2])+'</h'+n+'>'; i++; continue; }

    if (isTable(i)){
      const head = splitRow(lines[i]); i += 2;
      let body = '';
      while (i < lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){
        body += '<tr>' + splitRow(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('') + '</tr>';
        i++;
      }
      out += '<div class="tablewrap"><table><thead><tr>'
           + head.map(c=>'<th>'+inline(c)+'</th>').join('')
           + '</tr></thead><tbody>'+body+'</tbody></table></div>';
      continue;
    }
    if (/^\s*>/.test(l)){
      let b = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) b.push(lines[i++].replace(/^\s*>\s?/,''));
      out += '<blockquote>'+markdown(b.join('\n'))+'</blockquote>';
      continue;
    }
    const li = l.match(/^\s*([-*]|\d+\.)\s+/);
    if (li){
      const ord = /\d/.test(li[1]); let items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])){
        let t = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,'');
        // continuation lines of the same bullet
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]))
          t += ' ' + lines[i++].trim();
        items.push('<li>'+inline(t)+'</li>');
      }
      out += (ord?'<ol>':'<ul>') + items.join('') + (ord?'</ol>':'</ul>');
      continue;
    }
    let p = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|\s*>|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !isTable(i))
      p.push(lines[i++]);
    out += '<p>'+inline(p.join(' '))+'</p>';
  }
  return out;
}

/* ---------- state ---------- */
const files = DATA.files || [];
const byPath = new Map(files.map(f=>[f.path,f]));
let current = location.hash.slice(1) || '';

// Every storage access is guarded: a page opened from file:// or a sandboxed viewer can
// throw on read as well as on write, and a remembered tab is not worth a blank page.
const remember = (k, v) => { try { if (v === undefined) return localStorage.getItem(k);
                                   localStorage.setItem(k, v); } catch(e) { return null; } };
let mode = remember('hub.mode') || 'cat';
const savedTheme = remember('hub.theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

/* ---------- header ---------- */
document.getElementById('stamp').textContent = DATA.generated || '';
document.getElementById('chips').innerHTML = (DATA.targets||[]).map(t =>
  '<span class="chip" title="'+esc(t.root)+' · takes: '+esc(t.accepts||'—')+'">'
  + '<i class="dot'+(t.detected?' on':'')+'"></i>'+esc(t.id)+'</span>').join('');

/* ---------- sidebar ---------- */
function groups(list){
  const g = new Map();
  for (const f of list){
    const k = mode === 'cat' ? (f.category || 'uncategorised') : f.dir;
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(f);
  }
  return [...g.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}
// Which groups the operator closed, per grouping mode, remembered across reloads.
let shut = new Set(JSON.parse(remember('hub.shut.'+mode) || '[]'));
const saveShut = () => remember('hub.shut.'+mode, JSON.stringify([...shut]));

const CARET = '<svg class="caret" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>';

function renderTree(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = q
    ? files.filter(f => (f.path+' '+f.name+' '+(f.summary||'')).toLowerCase().includes(q)
                     || (f.body||'').toLowerCase().includes(q))
    : files;
  const tree = document.getElementById('tree');
  if (!list.length){ tree.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
  // While searching every group opens, because a hit hidden inside a closed group reads
  // as no hit at all.
  tree.innerHTML = groups(list).map(([k,items]) =>
    '<details class="group" data-k="'+esc(k)+'"'+((q || !shut.has(k)) ? ' open' : '')+'>'
    + '<summary>'+'<span class="fold" title="Fold">'+CARET+'</span>'
    + '<span class="gname" data-g="'+esc(k)+'" title="Open '+esc(k)+'">'+esc(k)+'</span>'
    + '<span class="count">'+items.length+'</span></summary>'
    + '<div class="items">' + items.map(f =>
        '<button class="item" data-p="'+esc(f.path)+'"'+(f.path===current?' aria-current="true"':'')+'>'
        + '<span class="nm">'+esc(f.name)+'</span><span class="rl">'+esc(f.role)+'</span></button>').join('')
    + '</div></details>').join('');
}

// One listener on the container instead of one per row: the tree is rebuilt on every
// keystroke while searching, and rebinding dozens of handlers each time is the kind of
// work that shows up as lag on a slow machine.
document.getElementById('tree').addEventListener('click', e => {
  // The caret folds; the name opens the group's page. Two targets, one row, so neither
  // action can be reached only by guessing which part of the row is live.
  const gname = e.target.closest('.gname');
  if (gname){ e.preventDefault(); select('group:' + gname.dataset.g); return; }
  const item = e.target.closest('.item');
  if (item){
    select(item.dataset.p);
    if (narrow()) setNav(false);
    return;
  }
  const sum = e.target.closest('summary');
  if (sum && !document.getElementById('q').value.trim()){
    const k = sum.parentElement.dataset.k;
    // The attribute still says what it said before the browser toggles it.
    if (sum.parentElement.hasAttribute('open')) shut.add(k); else shut.delete(k);
    saveShut();
  }
});

/* ---------- main ---------- */
function overview(){
  const roles = {};
  for (const f of files) roles[f.role] = (roles[f.role]||0)+1;
  const cats = new Set(files.map(f=>f.category).filter(Boolean));
  const undeclared = DATA.discovered || [];
  return '<div class="wrap">'
  + '<div class="crumb">'+esc(DATA.repo||'')+'</div>'
  + '<h1 class="title">Agent Hub</h1>'
  + '<p style="color:var(--ink-2);margin:0 0 4px">Every instruction, skill, agent and hook this machine\'s AI agents are running, read straight from the repo that installs them.</p>'
  + '<div class="cards">'
    + card(files.length,'files','across '+Object.keys(roles).length+' roles')
    + card(cats.size,'categories',[...cats].sort().join(' · '))
    + card((DATA.targets||[]).filter(t=>t.detected).length+'/'+(DATA.targets||[]).length,'agents detected',
           (DATA.targets||[]).map(t=>t.id).join(' · '))
    + card(undeclared.length,'undeclared found', undeclared.length?'no adapter yet':'nothing unknown here')
  + '</div>'
  + '<h2 style="font-size:17px;margin:0 0 8px">Targets</h2>'
  + '<div class="tablewrap"><table class="doc" style="margin:0"><thead><tr><th>Agent</th><th>Root</th><th>Doctrine</th><th>Mode</th><th>Takes</th><th>Here</th></tr></thead><tbody>'
  + (DATA.targets||[]).map(t=>'<tr><td><code>'+esc(t.id)+'</code></td><td><code>'+esc(t.root)+'</code></td>'
      +'<td><code>'+esc(t.doctrine_path)+'</code>'+(t.doctrine_ok?'':' <span style="color:var(--warn)">unlinked</span>')+'</td>'
      +'<td>'+esc(t.doctrine_mode)+'</td><td>'+esc(t.accepts||'—')+'</td>'
      +'<td>'+(t.detected?'<b style="color:var(--ok)">yes</b>':'<span style="color:var(--ink-3)">no</span>')+'</td></tr>').join('')
  + '</tbody></table></div>'
  + (undeclared.length
      ? '<h2 style="font-size:17px;margin:26px 0 8px">Found on this machine, no adapter</h2>'
        + '<div class="note">These directories look like agent config, but nothing here knows what files they read. '
        + 'Nothing was installed into them — guessing at an unknown format writes broken files. '
        + 'Add a row to <code>lib/targets.sh</code> for any you want supported.</div>'
        + '<div class="tablewrap"><table class="doc" style="margin:0"><thead><tr><th>Directory</th><th>Looks like</th></tr></thead><tbody>'
        + undeclared.map(d=>'<tr><td><code>'+esc(d.dir)+'</code></td><td>'+esc(d.note)+'</td></tr>').join('')
        + '</tbody></table></div>'
      : '')
  + '<h2 style="font-size:17px;margin:26px 0 8px">Commands</h2>'
  + (DATA.commands||[]).map(c=>'<div class="cmd"><code>'+esc(c)+'</code><button class="copy" data-c="'+esc(c)+'">copy</button></div>').join('')
  + '<hr class="rule"><p style="color:var(--ink-3);font-size:12.5px">This page is generated and read-only. '
  + 'It never installs, edits or deletes anything — the commands above are for you to run.</p>'
  + '</div>';
}
function card(n,l,s){ return '<div class="card"><div class="n">'+esc(String(n))+'</div><div class="l">'+esc(l)+'</div><div class="s">'+esc(s||'')+'</div></div>'; }

// A role's page answers one question the file list cannot: is this installed, and where.
function groupView(key){
  const list = files.filter(f => (mode === 'cat' ? (f.category || 'uncategorised') : f.dir) === key);
  const roles = [...new Set(list.map(f => f.role))];
  const rows = (DATA.roles || []).filter(r => roles.includes(r.role));
  const everyTarget = (DATA.targets || []).map(t => t.id);

  const reach = rows.map(r => {
    const missing = everyTarget.filter(t => !r.takes.includes(t));
    const pending = r.takes.filter(t => !r.has.includes(t));
    return '<tr><td><code>' + esc(r.role) + '</code></td><td>' + r.count + '</td>'
      + '<td>' + (r.has.length ? r.has.map(t=>'<b style="color:var(--ok)">'+esc(t)+'</b>').join(', ') : '—') + '</td>'
      + '<td>' + (pending.length ? '<span style="color:var(--warn)">'+pending.join(', ')+'</span>' : '—') + '</td>'
      + '<td>' + (missing.length ? '<span style="color:var(--ink-3)">'+missing.join(', ')+'</span>' : '—') + '</td></tr>';
  }).join('');

  const notTaken = rows.flatMap(r => everyTarget
    .filter(t => !r.takes.includes(t))
    .map(t => ({role: r.role, target: t})));

  return '<div class="wrap">'
    + '<div class="crumb">' + esc(mode === 'cat' ? 'category' : 'folder') + '</div>'
    + '<h1 class="title">' + esc(key) + '</h1>'
    + '<div class="reach">' + list.length + ' item' + (list.length === 1 ? '' : 's') + '</div>'
    + (rows.length
        ? '<h2 style="font-size:17px;margin:0 0 8px">Where this is installed</h2>'
          + '<div class="tablewrap"><table class="doc" style="margin:0"><thead><tr>'
          + '<th>Role</th><th>Items</th><th>Installed</th><th>Accepted, not yet linked</th><th>Agent has no equivalent</th>'
          + '</tr></thead><tbody>' + reach + '</tbody></table></div>'
          + (notTaken.length
              ? '<div class="note">'
                + notTaken.map(x => '<code>' + esc(x.target) + '</code> does not take <code>'
                    + esc(x.role) + '</code>. Supporting it means declaring what that agent reads, '
                    + 'in <code>lib/targets.sh</code> — never guessing at a format.').join('<br>')
                + '</div>'
              : '')
          + '<h2 style="font-size:17px;margin:26px 0 8px">Re-link everything</h2>'
          + '<div class="cmd"><code>bin/sync.sh</code><button class="copy" data-c="bin/sync.sh">copy</button></div>'
          + '<div class="cmd"><code>bin/sync.sh --status</code><button class="copy" data-c="bin/sync.sh --status">copy</button></div>'
        : '')
    + '<h2 style="font-size:17px;margin:26px 0 8px">Contents</h2>'
    + '<div class="tablewrap"><table class="doc" style="margin:0"><thead><tr><th>Name</th><th>Role</th><th>What it does</th></tr></thead><tbody>'
    + list.map(f => '<tr><td><button class="linky" data-p="' + esc(f.path) + '">' + esc(f.name) + '</button></td>'
        + '<td><code>' + esc(f.role) + '</code></td><td>' + esc((f.summary || '').slice(0, 150)) + '</td></tr>').join('')
    + '</tbody></table></div></div>';
}

function view(path){
  const main = document.getElementById('main');
  if (path && path.startsWith('group:')){
    main.innerHTML = groupView(path.slice(6));
    wireCopy(); wireLinks(); main.scrollTop = 0;
    document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current','false'));
    return;
  }
  if (!path || !byPath.has(path)){ main.innerHTML = overview(); wireCopy(); main.scrollTop = 0; return; }
  const f = byPath.get(path);
  const reach = (f.installed||[]).length
      ? 'linked into <b>'+f.installed.join('</b>, <b>')+'</b>'
      : 'not installed by any target';
  const body = f.lang === 'markdown'
      ? '<div class="doc">'+markdown(f.body||'')+'</div>'
      : '<div class="doc"><pre><code>'+esc(f.body||'')+'</code></pre></div>';
  main.innerHTML = '<div class="wrap">'
    + '<div class="crumb">'+esc(f.path)+'</div>'
    + '<h1 class="title">'+esc(f.name)+'</h1>'
    + '<div class="badges">'
      + (f.category?'<span class="badge cat">'+esc(f.category)+'</span>':'')
      + '<span class="badge">'+esc(f.role)+'</span>'
      + '<span class="badge">'+esc(f.lang)+'</span>'
      + '<span class="badge">'+esc(f.size)+'</span>'
    + '</div>'
    + '<div class="reach">'+reach+'</div>'
    + body + '</div>';
  main.scrollTop = 0;
  document.querySelectorAll('.item').forEach(b=>
    b.setAttribute('aria-current', b.dataset.p === path ? 'true' : 'false'));
}
function wireLinks(){
  document.querySelectorAll('.linky').forEach(b => b.onclick = () => select(b.dataset.p));
}
function wireCopy(){
  document.querySelectorAll('.copy').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.c); b.textContent='copied'; }
    catch(e){ b.textContent='select it'; }
    setTimeout(()=>b.textContent='copy', 1200);
  });
}

/* ---------- wiring ---------- */
// Selection is driven by state, not by the URL. The hash is kept in step so a view can
// be linked to and survives a reload, but a context that refuses to change it - a
// sandboxed viewer, a data: URL - still navigates normally.
function select(path){
  current = path;
  try { history.replaceState(null, '', '#' + path); } catch(e) {}
  view(path);
}
addEventListener('hashchange', ()=>{ const h = location.hash.slice(1); if (h !== current) select(h); });
document.getElementById('q').addEventListener('input', renderTree);
// One class, one button, both layouts. What "closed" looks like is CSS's decision - a
// zero-width column on a wide screen, a dismissed overlay on a narrow one - so the
// script never measures the viewport to work out what to do.
const app = document.querySelector('.app');
const mq = matchMedia('(max-width:780px)');
const narrow = () => mq.matches;
function setNav(open, persist){
  app.classList.toggle('navclosed', !open);
  if (persist !== false) remember('hub.nav', open ? '' : '1');
}
// Default open on a wide screen, closed on a narrow one - and re-decided whenever the
// window crosses the breakpoint, so a resize or a rotation cannot strand the file list
// hidden with no way back to it. Crossing the line does not overwrite the stored choice.
const defaultNav = () => setNav(narrow() ? false : remember('hub.nav') !== '1', false);
defaultNav();
mq.addEventListener('change', defaultNav);
document.getElementById('menu').onclick = () => setNav(app.classList.contains('navclosed'));

document.getElementById('foldAll').onclick = () => {
  const open = document.querySelectorAll('.group[open]').length;
  if (open){ document.querySelectorAll('.group').forEach(g => shut.add(g.dataset.k)); }
  else { shut.clear(); }
  saveShut();
  renderTree();
  document.getElementById('foldAll').textContent = open ? 'expand all' : 'collapse all';
};
document.getElementById('theme').onclick = ()=>{
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  const now = document.documentElement.dataset.theme || (dark?'dark':'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  remember('hub.theme', next);
};
function setMode(m){
  mode = m;
  shut = new Set(JSON.parse(remember('hub.shut.'+m) || '[]'));
  document.getElementById('byCat').setAttribute('aria-selected', m==='cat');
  document.getElementById('byDir').setAttribute('aria-selected', m==='dir');
  remember('hub.mode', m);
  renderTree();
}
document.getElementById('byCat').onclick = ()=>setMode('cat');
document.getElementById('byDir').onclick = ()=>setMode('dir');
addEventListener('keydown', e=>{
  if (e.key === '/' && e.target.tagName !== 'INPUT'){ e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'Escape'){ const q=document.getElementById('q'); if(q.value){ q.value=''; renderTree(); } q.blur(); }
});
setMode(mode);
view(current);
</script>
</body>
</html>
